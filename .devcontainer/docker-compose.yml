services:
  workspace:
    image: debian:bookworm
    command: sleep infinity
    init: true
    working_dir: /workspaces/t3code
    volumes:
      - ..:/workspaces/t3code:cached
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      HOST: 0.0.0.0
      PORT: ${DEV_HOST_WEB_PORT:-5733}
      T3CODE_DEV_PUBLIC_ORIGIN: https://${DEV_HOST_PROJECT:-t3code}.${DEV_HOST_DOMAIN:-rmcd.fyi}
      T3CODE_HOST: 0.0.0.0
      T3CODE_PORT: ${DEV_HOST_API_PORT:-13773}
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${DEV_HOST_DOCKER_NETWORK:-rmcd-devhost}
      traefik.http.routers.t3code-api.entrypoints: web
      traefik.http.routers.t3code-api.priority: "20"
      traefik.http.routers.t3code-api.rule: Host(`${DEV_HOST_PROJECT:-t3code}.${DEV_HOST_DOMAIN:-rmcd.fyi}`) && (PathPrefix(`/api`) || PathPrefix(`/.well-known`) || PathPrefix(`/attachments`) || PathPrefix(`/ws`))
      traefik.http.routers.t3code-api.service: t3code-api
      traefik.http.routers.t3code-web.entrypoints: web
      traefik.http.routers.t3code-web.priority: "10"
      traefik.http.routers.t3code-web.rule: Host(`${DEV_HOST_PROJECT:-t3code}.${DEV_HOST_DOMAIN:-rmcd.fyi}`)
      traefik.http.routers.t3code-web.service: t3code-web
      traefik.http.services.t3code-api.loadbalancer.server.port: ${DEV_HOST_API_PORT:-13773}
      traefik.http.services.t3code-web.loadbalancer.server.port: ${DEV_HOST_WEB_PORT:-5733}
    networks:
      - default
      - devhost

networks:
  devhost:
    external: true
    name: ${DEV_HOST_DOCKER_NETWORK:-rmcd-devhost}
